<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diamond Prediction Form</title>
  <link href="../static/CSS/formstyle.css" rel="stylesheet">
</head>

<body>
  <div class="container">
    <div class="page-header">
      <h1>Diamond Prediction Form</h1>
      <a class="back-link" href="/">← Back to Home</a>
    </div>

    <p class="helper-text">Fill in the diamond details to generate an estimated price.</p>

    <form action="{{url_for('predict_datapoint')}}" method="POST">
      <div class="form-group">
        <label for="carat">Carat</label>
        <input type="number" id="carat" name="carat" step="0.01" min="0" placeholder="e.g., 0.75" required>
      </div>

      <div class="form-group">
        <label for="depth">Depth</label>
        <input type="number" id="depth" name="depth" step="0.01" min="0" placeholder="e.g., 61.5" required>
      </div>

      <div class="form-group">
        <label for="table">Table</label>
        <input type="number" id="table" name="table" step="0.01" min="0" placeholder="e.g., 57" required>
      </div>

      <div class="form-group">
        <label for="x">Length (x)</label>
        <input type="number" id="x" name="x" step="0.01" min="0" placeholder="e.g., 5.82" required>
      </div>

      <div class="form-group">
        <label for="y">Width (y)</label>
        <input type="number" id="y" name="y" step="0.01" min="0" placeholder="e.g., 5.79" required>
      </div>

      <div class="form-group">
        <label for="z">Height (z)</label>
        <input type="number" id="z" name="z" step="0.01" min="0" placeholder="e.g., 3.56" required>
      </div>

      <div class="form-group">
        <label for="cut">Cut</label>
        <select id="cut" name="cut" required>
          <option value="Fair">Fair</option>
          <option value="Good">Good</option>
          <option value="Very Good">Very Good</option>
          <option value="Premium">Premium</option>
          <option value="Ideal">Ideal</option>
        </select>
      </div>

      <div class="form-group">
        <label for="color">Color</label>
        <select id="color" name="color" required>
          <option value="D">D</option>
          <option value="E">E</option>
          <option value="F">F</option>
          <option value="G">G</option>
          <option value="H">H</option>
          <option value="I">I</option>
          <option value="J">J</option>
        </select>
      </div>

      <div class="form-group">
        <label for="clarity">Clarity</label>
        <select id="clarity" name="clarity" required>
          <option value="I1">I1</option>
          <option value="SI2">SI2</option>
          <option value="SI1">SI1</option>
          <option value="VS2">VS2</option>
          <option value="VS1">VS1</option>
          <option value="VVS2">VVS2</option>
          <option value="VVS1">VVS1</option>
          <option value="IF">IF</option>
        </select>
      </div>

      <input type="submit" value="Estimate Price">
    </form>

    {% if final_result is defined %}
    <div class="final-result">
      Estimated Price: <span>${{ final_result }}</span>
    </div>
    {% endif %}
  </div>
</body>

</html>
